# anet.chat — collaboration-brain orchestrator
#
# Mounts:
#   ./refs/<persona>-skill → /skills/personas/<persona>/   (one folder per persona)
#   ./refs/mcp_excalidraw/skills/excalidraw-skill → /skills/excalidraw-skill/  (reference cheatsheet)
#
# Persona pool is declared in orchestrator/personas.json and can be extended freely
# (e.g. to add 40+ professor personas, drop their SKILL.md + papers/ folder under
# refs/<slug>-skill/ and append a registry entry).
#
# Run:
#   1) cd refs/mcp_excalidraw && docker compose --profile full up -d
#   2) cd /data/projs/anetchat && docker compose --env-file .minimax.env up -d --build

services:
  souls:
    build:
      context: ./orchestrator
    image: anet-souls:latest
    container_name: anet-souls
    environment:
      - CANVAS_URL=http://canvas:3000
      # PRIMARY LLM — OpenAI Responses (gpt-5.4 via tokhubs)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://tokhubs.com}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-xhigh}
      # 1st FALLBACK — MiniMax (Anthropic-compatible)
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      # 2nd FALLBACK — Doubao Responses API
      - DOUBAO_RESPONSES_URL=${DOUBAO_RESPONSES_URL:-https://ark.cn-beijing.volces.com/api/v3/responses}
      - DOUBAO_RESPONSES_API_KEY=${DOUBAO_RESPONSES_API_KEY}
      - DOUBAO_RESPONSES_DEFAULT_MODEL=${DOUBAO_RESPONSES_DEFAULT_MODEL:-doubao-seed-2-0-pro-260215}
      - TZ=Asia/Shanghai
    volumes:
      # v14: condensed personas are baked into the image at /app/personas/.
      # The refs/ bind-mounts are no longer used (kept here commented for reference).
      # - ./refs/feynman-skill:/skills/personas/feynman:ro
      # - ./refs/munger-skill:/skills/personas/munger:ro
      # - ./refs/karpathy-skill:/skills/personas/karpathy:ro
      # - ./refs/elon-musk-skill:/skills/personas/musk:ro
      - ./refs/mcp_excalidraw/skills/excalidraw-skill:/skills/excalidraw-skill:ro
    networks:
      - canvas-net
    restart: unless-stopped

networks:
  canvas-net:
    name: mcp_excalidraw_mcp-network
    external: true
